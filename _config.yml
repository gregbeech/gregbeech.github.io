# Site configuration for the Chirpy theme
# See https://github.com/cotes2020/jekyll-theme-chirpy/wiki for documentation.

theme: jekyll-theme-chirpy

lang: en
timezone: Europe/London

title: Greg Beech
tagline: Just Another Engineer
description: >-
  Blog and CV of Greg Beech

url: https://www.gregbeech.com
baseurl: ""

github:
  username: gregbeech

twitter:
  username: gregbeech

social:
  name: Greg Beech
  email: greg@gregbeech.com
  links:
    - https://www.gregbeech.com/about/
    - https://github.com/gregbeech
    - https://www.linkedin.com/in/gregbeech

analytics:
  google:
    id:

theme_mode:

avatar: /assets/img/gregbeech.jpg

social_preview_image:

toc: true

comments:
  provider: disqus
  disqus:
    shortname: gregbeech

pwa:
  enabled: true
  cache:
    enabled: true

paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      # Keep the date-based URLs from the previous theme so existing links still work.
      permalink: /:year/:month/:day/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - Procfile
  - vendor
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [tags]
  layouts:
    tag: tag
  permalinks:
    tag: /tags/:name/
