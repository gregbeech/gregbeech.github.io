# Optional introductions shown at the top of tag pages, keyed by tag name.
engineering-101: >
  These are introductory level posts targeted at people who are relatively
  new to software engineering, particularly in startups and product companies.
  They typically cover relatively basic things that experienced software
  engineers should already know. The subject matter is usually well
  documented already, so the posts tend to exist to cover specific cases I
  observe, or because I can't find posts that explain things the way I want to.
scala-101: >
  These are introductory level posts targeted at people who are relatively
  new to Scala and trying to get to grips with its idioms. That said, even
  people who have been working with Scala for a while may find something
  interesting in them.
scala: >
  Of all the languages I've worked in over the years, Scala is the one that I
  find fits my approach best. It's a heavily flawed language and not easy to
  get to grips with, but it has a powerful type system and lots of interesting
  features, a strong community and great open source libraries, and runs on
  the JVM which means it's easy to support.
talks: >
  I've done plenty of internal talks over the years, and recently started
  doing them at conferences. Talking in front of hundreds of people and
  a video camera is very nerve wracking, but at least I've got over the hurdle
  of doing the first couple. If you'd like me to speak at your conference then
  get in touch.
